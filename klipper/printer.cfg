[mcu]
# This config targets the BIGTREETECH SKR Pico V1.0.
# Replace this with the stable by-id path for your board after flashing Klipper.
serial: /dev/serial/by-id/usb-Klipper_rp2040_REPLACE_WITH_YOUR_ID-if00

[printer]
kinematics: delta
max_velocity: 200
max_accel: 3000
max_z_velocity: 200
max_z_accel: 3000
square_corner_velocity: 5.0
#delta_radius: 105
print_radius: 90
minimum_z_position: -20

[delta_calibrate]
radius: 90

[stepper_a]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio4
#position_endstop: 210
#arm_length: 232.00

[tmc2209 stepper_a]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_b]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
#position_endstop: 210
#arm_length: 232.00

[tmc2209 stepper_b]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_c]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio25
#position_endstop: 210
#arm_length: 232.00

[tmc2209 stepper_c]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 32.51
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 275

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[verify_heater extruder]
# I'm tired boss
check_gain_time: 90  # Default is 60

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
#control: watermark
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
# The maximum "cumulative temperature error" before raising an error.
# Default is 120.
max_error: 300
# This controls how long it takes for the heater to check if it's
# actually heating. Increase this for slow-heating beds (e.g., to 120-180).
# Default is 60 for heater_bed.
check_gain_time: 120
hysteresis: 5
heating_gain: 2




[fan]
pin: gpio17

[heater_fan hotend_fan]
pin: gpio18
heater: extruder
heater_temp: 50.0

[probe]
pin: ^gpio22
x_offset: 9.40
y_offset: -9.00
#z_offset: 4.160
speed: 5.0
samples: 1

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_radius: 80
mesh_origin: 0,0
round_probe_count: 5


[gcode_arcs]
resolution: 0.1

[display_status]
[pause_resume]
[exclude_object]
[virtual_sdcard]
path: ~/printer_data/gcodes

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor skr_pico]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[neopixel board_neopixel]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    G91
    G1 E-3 F2100
    G1 Z10 F3000
    G90
    G1 X0 Y0 Z50 F6000  ; park high in center

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1 F2100
    G90
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y0 Z50 F6000  ; park high in center
    CLEAR_PAUSE
    BASE_CANCEL_PRINT

[gcode_macro FULL_CALIBRATE]
description: Calibrate delta and bed mesh and save config
gcode:
    TURN_OFF_HEATERS
    G28
    DELTA_CALIBRATE
    BED_MESH_CALIBRATE
    SAVE_CONFIG

# Override "wait for bed heat" with more tolerant behaviour
[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% set target = params.S|float %}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target - 1.5}

