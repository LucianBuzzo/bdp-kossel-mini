[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: delta
max_velocity: 200
max_accel: 3000
max_z_velocity: 200
max_z_accel: 3000
square_corner_velocity: 5.0
#delta_radius: 105
print_radius: 90
minimum_z_position: -20

[delta_calibrate]
radius: 90

[stepper_a]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PD2
#position_endstop: 210
#arm_length: 232.00

[stepper_b]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PJ0
#position_endstop: 210
#arm_length: 232.00

[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PE4
#position_endstop: 210
#arm_length: 232.00

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 32.51
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 275

[verify_heater extruder]
# I'm tired boss
check_gain_time: 90  # Default is 60

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
#control: watermark
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
# The maximum "cumulative temperature error" before raising an error.
# Default is 120.
max_error: 300
# This controls how long it takes for the heater to check if it's
# actually heating. Increase this for slow-heating beds (e.g., to 120-180).
# Default is 60 for heater_bed.
check_gain_time: 120
hysteresis: 5
heating_gain: 2




[fan]
pin: PH6

[probe]
pin: ^PD3
x_offset: 9.40
y_offset: -9.00
#z_offset: 4.160
speed: 5.0
samples: 1

[display]
lcd_type: hd44780
rs_pin: PH1
e_pin: PH0
d4_pin: PA1
d5_pin: PA3
d6_pin: PA5
d7_pin: PA7
line_length: 20
encoder_pins: ^PC6, ^PC4
click_pin: ^!PC2

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_radius: 80
mesh_origin: 0,0
round_probe_count: 5


[gcode_arcs]
resolution: 0.1

[display_status]
[pause_resume]
[exclude_object]
[virtual_sdcard]
path: ~/printer_data/gcodes

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    G91
    G1 E-3 F2100
    G1 Z10 F3000
    G90
    G1 X0 Y0 Z50 F6000  ; park high in center

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1 F2100
    G90
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y0 Z50 F6000  ; park high in center
    CLEAR_PAUSE
    BASE_CANCEL_PRINT

[gcode_macro FULL_CALIBRATE]
description: Calibrate delta and bed mesh and save config
gcode:
    TURN_OFF_HEATERS
    G28
    DELTA_CALIBRATE
    BED_MESH_CALIBRATE
    SAVE_CONFIG

# Override "wait for bed heat" with more tolerant behaviour
[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% set target = params.S|float %}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target - 1.5}

